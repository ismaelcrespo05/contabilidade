<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — TRINUS</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #27313a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .logo-marca-dagua {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 620px;
            max-width: 90vw;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: #fff;
            border-radius: 14px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
        }

        .login-card h1 {
            text-align: center;
            letter-spacing: 2px;
            color: #27313a;
            margin-bottom: 6px;
        }

        .login-card p.subtitulo {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .campo { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #27313a;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .erro {
            background: #fde2e2;
            color: #b00020;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>

    <img src="{% static 'core/logo.png' %}" alt="" class="logo-marca-dagua">

    <div class="login-card">
        <h1>TRINUS</h1>
        <p class="subtitulo">Acompanhamento Contábil</p>

        {% if form.errors %}
            <div class="erro">Usuário ou senha inválidos.</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="campo">
                <label for="id_username">Usuário</label>
                <input type="text" name="username" id="id_username" autofocus required>
            </div>

            <div class="campo">
                <label for="id_password">Senha</label>
                <input type="password" name="password" id="id_password" required>
            </div>

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit">Entrar</button>
        </form>
    </div>

</body>
</html>
